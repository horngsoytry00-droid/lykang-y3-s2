// User State
let userAnswers = {};
let currentFilter = 'all';
let allImagesVisible = true;

const totalQuestions = qcmData.filter(i => i.type === 'q').length;
document.getElementById('totalQuestionsCount').textContent = totalQuestions;

function renderCards() {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    qcmData.forEach(item => {
        const imgName = `sssss_page_${item.page}.png`;
        const card = document.createElement('div');
        const isSlide = item.type === 'slide';
        card.className = `card ${item.hasImg ? 'has-img' : ''} ${isSlide ? 'is-slide' : ''}`;
        card.id = `card-page-${item.page}`;
        card.setAttribute('data-page', item.page);
        card.setAttribute('data-has-img', item.hasImg);

        const imgBadge = item.hasImg ? '<span class="badge badge-img">📷 Has Image</span>' : '';
        const slideBadge = isSlide ? '<span class="badge badge-slide">Slide</span>' : '';

        let optionsHtml = '';
        if (item.type === 'q' && item.options) {
            optionsHtml = '<div class="options-list">';
            item.options.forEach((opt, idx) => {
                optionsHtml += `<button class="option-btn" onclick="selectOption(${item.page}, ${idx})">${opt}</button>`;
            });
            optionsHtml += '</div>';
        }

        const hiddenClass = allImagesVisible ? '' : 'img-hidden';

        card.innerHTML = `
            <div class="card-header">
                <div>
                    <span class="badge badge-page">Page ${item.page}</span>
                    ${imgBadge}
                    ${slideBadge}
                    <button class="btn btn-sm" onclick="toggleSingleImage(${item.page})">👁️ Toggle Image</button>
                </div>
                <a href="${imgName}" target="_blank" class="img-link">🔗 Open Image in New Tab</a>
            </div>
            <div class="question-text">${item.text}</div>
            ${optionsHtml}
            <div class="img-container ${hiddenClass}" id="img-container-${item.page}">
                <img src="${imgName}" class="q-img" loading="lazy" onerror="this.closest('.img-container').style.display='none';">
            </div>
        `;

        container.appendChild(card);
    });

    updateScoreboard();
}

// IN-PLACE OPTION SELECTION (Does NOT move or remove the card)
function selectOption(page, selectedIdx) {
    if (userAnswers[page] !== undefined) return; // Prevent changing answer once submitted

    userAnswers[page] = selectedIdx;
    const item = qcmData.find(i => i.page === page);
    const card = document.getElementById(`card-page-${page}`);
    if (!card || !item) return;

    const optionBtns = card.querySelectorAll('.option-btn');
    optionBtns.forEach((btn, idx) => {
        btn.classList.add('disabled');
        btn.onclick = null; // Disable further clicking

        if (idx === item.ans) {
            btn.classList.add('show-correct');
        }
        if (idx === selectedIdx) {
            if (selectedIdx === item.ans) {
                btn.classList.add('selected-correct');
            } else {
                btn.classList.add('selected-incorrect');
            }
        }
    });

    // Add feedback message inside the card without moving it
    const isRight = selectedIdx === item.ans;
    const msgClass = isRight ? 'msg-correct' : 'msg-incorrect';
    const msgText = isRight ? '✓ Correct Answer!' : `❌ Incorrect! Correct Answer: ${item.options[item.ans]}`;

    let feedbackDiv = card.querySelector('.feedback-msg');
    if (!feedbackDiv) {
        feedbackDiv = document.createElement('div');
        card.querySelector('.options-list').after(feedbackDiv);
    }
    feedbackDiv.className = `feedback-msg ${msgClass}`;
    feedbackDiv.innerHTML = msgText;

    updateScoreboard();
}

// TOGGLE ALL IMAGES GLOBAL
function toggleAllImages() {
    allImagesVisible = !allImagesVisible;
    const btn = document.getElementById('toggleAllImgBtn');
    
    if (allImagesVisible) {
        btn.textContent = '👁️ Hide All Images';
        document.querySelectorAll('.img-container').forEach(el => el.classList.remove('img-hidden'));
    } else {
        btn.textContent = '👁️ Show All Images';
        document.querySelectorAll('.img-container').forEach(el => el.classList.add('img-hidden'));
    }
}

// TOGGLE SINGLE IMAGE PER CARD
function toggleSingleImage(page) {
    const imgContainer = document.getElementById(`img-container-${page}`);
    if (imgContainer) {
        // If it was hidden by onerror, restore inline display style
        imgContainer.style.display = '';
        imgContainer.classList.toggle('img-hidden');
    }
}

function updateScoreboard() {
    let answered = 0;
    let correct = 0;

    qcmData.forEach(item => {
        if (item.type === 'q' && userAnswers[item.page] !== undefined) {
            answered++;
            if (userAnswers[item.page] === item.ans) {
                correct++;
            }
        }
    });

    document.getElementById('answeredCount').textContent = answered;
    document.getElementById('correctCount').textContent = correct;
    const percent = answered > 0 ? Math.round((correct / answered) * 100) : 0;
    document.getElementById('accuracyPercent').textContent = `${percent}%`;
}

function resetQuiz() {
    if (confirm("Are you sure you want to reset your quiz progress?")) {
        userAnswers = {};
        renderCards();
    }
}

function setFilter(filter) {
    currentFilter = filter;
    
    document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('btn-active'));
    document.getElementById(`filter-${filter}`).classList.add('btn-active');
    
    filterCards();
}

function filterCards() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
        const page = parseInt(card.getAttribute('data-page'));
        const item = qcmData.find(i => i.page === page);
        const text = card.textContent.toLowerCase();
        const hasImg = card.getAttribute('data-has-img') === 'true';
        const isAnswered = userAnswers[page] !== undefined;
        const isCorrect = isAnswered && (userAnswers[page] === item.ans);

        let matchesFilter = true;
        if (currentFilter === 'img') matchesFilter = hasImg;
        if (currentFilter === 'unanswered') matchesFilter = (item.type === 'q' && !isAnswered);
        if (currentFilter === 'incorrect') matchesFilter = (item.type === 'q' && isAnswered && !isCorrect);

        let matchesSearch = text.includes(query);

        if (matchesFilter && matchesSearch) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

// Initial render
renderCards();
</script>
